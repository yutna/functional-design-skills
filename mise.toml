# The Node version itself lives in .node-version, not here, because that is
# the format actions/setup-node can read: it matches a bare version on a line
# and does not parse TOML, so a version written here would be invisible to
# continuous integration. This file exists only to tell mise to honour that
# file, which recent versions do not do by default.
#
# Node runs every validation script, and markdownlint-cli2 comes from npm.
#
# PowerShell is here because this repository keeps two implementations of
# each install script, and the rule is that a change to one is a change to
# the other in the same commit. Without a local pwsh there is no way to run
# the PowerShell half, and "continuous integration will catch it" is how the
# Windows-only branch of link-local.ps1 went unrun for as long as it did. It
# is a large download; skip it with `mise settings add disable_tools
# powershell` if you are only touching prose.

[settings]
idiomatic_version_file_enable_tools = ["node"]

[tools]
powershell = "7.6.6"
