name: pr-check
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft,
            assigned, unassigned, milestoned, demilestoned, labeled, unlabeled]
permissions: {}
jobs:
  pr-check:
    uses: yutna/oss-kit/.github/workflows/pr-check.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
