name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .node-version is the one place the version is written. mise reads it
      # too, so a local `mise install` and this job cannot drift apart.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown with default rules
        run: npm run lint:md

      - name: Reject markdownlint configuration
        run: |
          if git ls-files | grep -E '(^|/)\.markdownlint'; then
            echo "A markdownlint config file is tracked; default rules only."
            exit 1
          fi
          if git grep -n -- '<!-- *markdownlint-' -- '*.md'; then
            echo "An inline markdownlint suppression was found."
            exit 1
          fi
          echo "No markdownlint configuration or suppression found."

      - name: Validate skill frontmatter, links and versions
        run: npm run validate:skills

      - name: Check the prose a linter cannot
        run: npm run validate:prose

      # A parser, not a type checker: it proves an example is the language its
      # fence claims, which is what makes it safe to paste.
      - name: Parse every code example
        run: npm run validate:examples

      # Elixir parses its own examples and the runner has no Elixir, so the
      # step above leaves those fences alone. They were checked only by
      # whoever remembered --with-elixir on their own machine, which meant a
      # broken example could merge unseen. The versions are quoted because
      # the action's README asks for strings: an unquoted 1.20 loses its
      # trailing zero. Only this job installs it. A fence parses the same on
      # every platform, and the windows job below is for what only Windows
      # can prove.
      - name: Install Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'

      # The flag is passed here and not in the npm script, because the
      # windows job runs that script too and has no Elixir to give it. This
      # parses the JavaScript, TypeScript and JSON again as well; the flag
      # only adds the Elixir fences.
      - name: Parse every Elixir example
        run: node scripts/validate-examples.mjs --with-elixir

      # A rule written in the same voice as every other rule gives an agent
      # no way to tell a contract from a preference. This checks the label
      # is there, not that it is the right one.
      - name: Check every core rule declares how strict it is
        run: npm run validate:rules

      # A hand-written count is a count that drifts; three had by 3.0.0.
      - name: Check documented counts against reality
        run: npm run validate:counts

      - name: Score routing coverage
        run: npm run eval:routing

      # A guard that has never failed has never been tested. This breaks each
      # one on a throwaway copy and confirms it fires.
      - name: Prove every guard still fires
        run: npm run test:guards

      # The scripts are the route most people take to install the pack, and
      # nothing else here runs them. They are written and edited on macOS, so
      # this is the only place they meet Linux. --dry-run writes nothing; the
      # link pair writes into .claude/skills, which is gitignored, and removes
      # it again. This covers link-local.ps1's non-Windows branch; the
      # windows job below covers the other one.
      - name: Run the install and link scripts
        run: |
          ./scripts/install.sh --dry-run
          ./scripts/link-local.sh
          ./scripts/link-local.sh --remove
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -File ./scripts/install.ps1 -DryRun
            pwsh -NoProfile -File ./scripts/link-local.ps1
            pwsh -NoProfile -File ./scripts/link-local.ps1 -Remove
          else
            echo "No pwsh on this runner; the PowerShell pair is not exercised."
          fi

      - name: Confirm the local-only notes are untracked
        run: |
          for file in SOURCES.md PRIVATE-NOTES.md; do
            if git ls-files --error-unmatch "$file" 2>/dev/null; then
              echo "$file must never be committed."
              exit 1
            fi
            git check-ignore -q "$file"
          done
          echo "SOURCES.md and PRIVATE-NOTES.md are gitignored and untracked."

  # Two things only Windows can prove. The first is the junction that
  # link-local.ps1 makes there and a symbolic link everywhere else, which no
  # other job can reach. The second is the line endings: .gitattributes
  # checks Markdown out with the platform's own, so this is the only
  # checkout where the validators meet CRLF. Until 3.0.1 this job ran the
  # scripts but not the suite, and three readers anchored to a bare \n went
  # unnoticed — one of them reported "0 core rule(s) labelled across 0
  # skill(s)" and exited clean, so the strictness gate was inert here.
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the whole suite against a CRLF checkout
        run: npm test

      - name: Prove every guard still fires here too
        run: npm run test:guards

      - name: Run the PowerShell scripts on the platform they are for
        shell: pwsh
        run: |
          ./scripts/install.ps1 -DryRun
          ./scripts/link-local.ps1
          $probe = '.claude/skills/functional-design/SKILL.md'
          if (-not (Test-Path -LiteralPath $probe)) {
            throw "the junction did not resolve: $probe is not readable"
          }
          Write-Host "read a skill back through the junction"
          ./scripts/link-local.ps1 -Remove
