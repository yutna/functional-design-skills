# GitHub Actions are updated automatically, and so is a new major of each
# library the examples are type-checked against. Nothing else is.
#
# The rest of npm is deliberately left out. markdownlint runs here with default
# rules and no configuration file, so a new release can add a rule and turn the
# build red with no content change, and typescript decides what the examples
# report, so the same holds for it. Those bumps want a person deciding when to
# take them. Security advisories still arrive, through Dependabot security
# updates rather than through this file.
#
# The example libraries are different in one respect: a new major is what the
# skills have to be told about, because their shapes move at the major. So the
# npm entry allows only those libraries, and ignores their minor and patch
# updates, which leaves a pull request for a new major and nothing else. The
# libraries are listed in LIBRARIES in scripts/validate-types.mjs, and that
# script fails when the two lists differ.
#
# effect-4 is on that list and not on this one. It is an alias, a second major
# of effect installed under another name, and Dependabot does not rewrite an
# alias. effect is watched under its own name, with 4.x ignored because the
# alias already holds it: what opens a pull request is a major nothing here
# pins. The script checks both halves of that as well.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: "chore"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: effect
      - dependency-name: zod
      - dependency-name: valibot
      - dependency-name: ts-pattern
      - dependency-name: xstate
      - dependency-name: immer
      - dependency-name: react
      - dependency-name: "@types/react"
      - dependency-name: "@standard-schema/spec"
      - dependency-name: next
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: effect
        versions:
          - "4.x"
    labels:
      - dependencies
      - chore
    commit-message:
      prefix: "chore"
