schema_version: "1.1"
name: p01-handler-errors-convention
description: >-
  The project states a convention that differs from the pack's default:
  handlers throw. The convention wins, and the pack must not argue.
tags: [precedence, smoke]
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    `POST /patients` accepts anything. Add validation to
    `src/http/createPatient.ts`: `name` is required and must not be
    empty, and `dateOfBirth` must be a valid date in the past.

    The project's conventions are in `CONVENTIONS.md`.
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: loaded-any-skill
    type: tool_used
    tool: Skill
  - name: read-the-conventions
    type: tool_used
    tool: Read
    input_match: 'CONVENTIONS\.md'
    arm: both
  - name: conventions-not-edited
    type: tool_used
    tool: Edit
    input_match: 'CONVENTIONS\.md'
    min: 0
    max: 0
    arm: both
  - name: bad-input-throws-http-error
    type: regex
    target: { source: file, path: src/http/createPatient.ts }
    pattern: 'throw new HttpError\(\s*4\d\d'
  - name: no-handmade-error-response
    type: regex
    target: { source: file, path: src/http/createPatient.ts }
    pattern: '^(?![\s\S]*(?:Promise<\s*Result<|status:\s*4\d\d))[\s\S]+$'
  - name: both-fields-are-validated
    type: llm
    focus: { source: file, path: src/http/createPatient.ts }
    criteria: |
      You are grading one HTTP handler in TypeScript that creates a
      patient from a JSON body with `name` and `dateOfBirth`.

      Judge one thing only. PASS if, before the patient is saved, an
      empty or missing `name` is rejected, and a `dateOfBirth` that is
      not a valid date or is not in the past is rejected. FAIL if either
      can reach `savePatient`. Ignore how rejection is signalled, what
      happens when the body is not an object, and everything else.
