schema_version: "1.1"
name: r02-one-function-fix
description: >-
  Row two of the calibration table: one function in a module that
  already has its own style. Match what is there.
tags: [restraint, smoke]
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    `formatAdmissionDate` in `src/legacy/admissions.ts` returns a string
    with "Invalid Date" in it for a patient who has not been discharged
    yet. Fix that.
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  max_turns: 30
  timeout_seconds: 600
graders:
  - name: loaded-any-skill
    type: tool_used
    tool: Skill
  - name: loaded-a-modelling-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?functional-(?:constraining-primitive-values|making-illegal-states-unrepresentable|modeling-with-algebraic-types|designing-workflow-pipelines|handling-errors-with-results)"'
  - name: no-new-machinery
    type: regex
    target: { source: file, path: src/legacy/admissions.ts }
    pattern: '^(?![\s\S]*(?:\bResult<|\bBrand<|\bOption<|\bMaybe<|unique symbol|\bclass\s+\w+))[\s\S]+$'
  - name: no-new-source-file
    type: regex
    target: files
    pattern: '^(?!.*\.test\.)\S+$'
    flags: m
    match: not_contains
  - name: fix-works
    type: llm
    focus: { source: file, path: src/legacy/admissions.ts }
    criteria: |
      You are grading one older TypeScript module after a bug fix. The
      bug: `formatAdmissionDate` returned a string containing "Invalid
      Date" for an admission whose `dischargedAt` is absent.

      Judge one thing only. PASS if `formatAdmissionDate` now returns
      a sensible string, with no "Invalid Date" in it, for an admission
      whose `dischargedAt` is absent. FAIL if it would still produce
      "Invalid Date" for such an admission. Whether the neighbouring
      functions were also changed does not matter. Ignore everything
      else.
